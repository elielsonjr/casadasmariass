<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa das Marias | Verificação de Idade</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="gate-body">
    <div class="gate-wrapper">
        <div class="gate-brand">
            <img src="assets/logo.png" alt="Casa das Marias" class="gate-logo">
        </div>
        <div class="gate-content">
            <div class="warning-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2>Aviso de Conteúdo</h2>
            <p class="gate-subtitle">Este site contém material voltado ao público adulto e é destinado exclusivamente para maiores de 18 anos.</p>
            <p class="gate-question">Você é maior de 18 anos?</p>
        </div>
        <div class="gate-actions">
            <button class="btn btn-exit" id="gate-exit-btn">Não (Sair)</button>
            <button class="btn btn-enter" id="gate-enter-btn">Sim, sou maior</button>
        </div>
        <div class="gate-footer">
            <p>&copy; 2026 Casa das Marias. Proibido para menores de 18 anos.</p>
        </div>
    </div>

    <script>
        document.getElementById('gate-enter-btn').addEventListener('click', function() {
            localStorage.setItem('marias_age_verified', 'true');
            window.location.href = 'main.html';
        });

        document.getElementById('gate-exit-btn').addEventListener('click', function() {
            window.location.href = 'https://www.google.com';
        });
    </script>
</body>
</html>
